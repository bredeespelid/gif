<title>OBS Overlay Preview</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  :root { --bg: #eeedf3; --chk-a: #ffffff; --chk-b: #d9d7e2; --muted: #615e70; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #15141c; --chk-a: #2a2836; --chk-b: #1f1d29; --muted: #a09db0; color-scheme: dark } }
  :root[data-theme="dark"] { --bg: #15141c; --chk-a: #2a2836; --chk-b: #1f1d29; --muted: #a09db0; color-scheme: dark }
  body { background: var(--bg); font-family: system-ui, sans-serif;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px; }
  .stage { max-width: 560px; margin: 0 auto; }
  video, img { display: block; width: 100%; height: auto; }
  [hidden] { display: none !important; }
  p { max-width: 560px; margin: 10px auto 0; font-size: 12px; color: var(--muted); font-family: ui-monospace, monospace; }
</style>
<div class="stage">
  <video id="v" src="clean-obs.webm" autoplay loop muted playsinline></video>
  <img id="w" src="clean.webp" alt="Animert figur uten bakgrunn" hidden>
</div>
<p id="n">clean-obs.webm · 480 × 468 · uten bakgrunn</p>
<script>
  // Safari (iPhone/Mac) ignores alpha in VP9 WebM and paints it black; show the identical WebP there instead
  const ua = navigator.userAgent;
  if (/iPhone|iPad/.test(ua) || (/Safari/.test(ua) && !/Chrome|Chromium|Edg|Firefox/.test(ua))) {
    document.getElementById('v').remove();
    document.getElementById('w').hidden = false;
    document.getElementById('n').textContent = 'Vist som WebP fordi Safari ikke kan vise gjennomsiktig WebM. Samme animasjon som clean-obs.webm, som blir gjennomsiktig i OBS.';
  }
</script>
